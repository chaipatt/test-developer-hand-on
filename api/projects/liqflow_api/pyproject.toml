[project]
name = "liqflow-api"
version = "0.1.0"
description = "liqflow_api — FastAPI service: Binance TH order book -> Postgres -> API + auth/RBAC."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.9.0",
    "asyncpg>=0.30.0",
    "aiohttp>=3.11.0",
    "attrs>=25.3.0",
    "bcrypt>=4.2.0",
    "pyjwt>=2.10.0",
    "orjson>=3.10.0",
]

[project.scripts]
liqflow-api = "lf_tool.liqflow_api.core:main"

[build-system]
requires = ["hatchling", "hatch-polylith-bricks"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.polylith-bricks]

[tool.polylith.bricks]
"../../bases/lf_tool/liqflow_api" = "lf_tool/liqflow_api"
"../../components/lf_tool/binance_client" = "lf_tool/binance_client"
"../../components/lf_tool/bitkub_client" = "lf_tool/bitkub_client"
"../../components/lf_tool/orderbook_poller" = "lf_tool/orderbook_poller"
"../../components/lf_tool/orderbook_repo" = "lf_tool/orderbook_repo"
"../../components/lf_tool/auth" = "lf_tool/auth"
