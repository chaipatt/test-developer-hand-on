# Optional CI: lint + test both services. Runs on Forgejo Actions (GitHub
# Actions-compatible syntax). Safe to delete if your host doesn't run it.
name: ci

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Test
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  # Integration: migrate a real Postgres, then run the DB-backed pytest suite
  # and the golang-migrate before/after report against the newest migration.
  db-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: liqflow
          POSTGRES_PASSWORD: liqflow
          POSTGRES_DB: liqflow
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U liqflow -d liqflow"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install golang-migrate CLI
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.1
      - name: Apply migrations
        run: |
          migrate -path db \
            -database 'postgres://liqflow:liqflow@localhost:5432/liqflow?sslmode=disable&search_path=public' up
      - name: Before/after migration report
        working-directory: tools/migration-report
        env:
          DSN: postgres://liqflow:liqflow@localhost:5432/liqflow?sslmode=disable&search_path=public
        run: go run . -path ../../db
      - uses: astral-sh/setup-uv@v5
      - name: Repo integration tests
        working-directory: api
        env:
          LIQFLOW_API_TEST_DSN: postgresql://liqflow:liqflow@localhost:5432/liqflow
        run: uv run pytest test/orderbook_repo
